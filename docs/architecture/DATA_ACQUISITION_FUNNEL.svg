<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L13,5 L0,10 Z" fill="#5b6472"/>
    </marker>
    <marker id="arG" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L13,5 L0,10 Z" fill="#2f7a4d"/>
    </marker>
    <marker id="arB" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L13,5 L0,10 Z" fill="#2a5d9e"/>
    </marker>
    <marker id="arA" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L13,5 L0,10 Z" fill="#a8641b"/>
    </marker>
  </defs>

  <rect width="1440" height="900" fill="#ffffff"/>

  <text x="72" y="46" font-size="27" font-weight="700" fill="#12171f">Vamo Place Data — Acquisition Funnel</text>
  <text x="72" y="74" font-size="15" fill="#5b6472">Three sources, three rights classes, one canonical graph. Provenance is carried per fact, never per row.</text>

  <text x="72"   y="118" font-size="13" font-weight="700" fill="#8b94a3" letter-spacing="1.2">SOURCE</text>
  <text x="410"  y="118" font-size="13" font-weight="700" fill="#8b94a3" letter-spacing="1.2">GATE — WHAT MAKES IT KEEPABLE</text>
  <text x="812"  y="118" font-size="13" font-weight="700" fill="#8b94a3" letter-spacing="1.2">CANONICAL</text>
  <text x="1128" y="118" font-size="13" font-weight="700" fill="#8b94a3" letter-spacing="1.2">PRODUCT</text>

  <!-- ================= LANE 1 : OPEN DATA ================= -->
  <rect x="72" y="134" width="300" height="118" rx="9" fill="#eaf5ee" stroke="#2f7a4d" stroke-width="2"/>
  <text x="92" y="162" font-size="17" font-weight="700" fill="#1d5334">Open licensed data</text>
  <text x="356" y="161" font-size="12" font-weight="700" fill="#2f7a4d" text-anchor="end">MILLIONS</text>
  <text x="92" y="188" font-size="13.5" fill="#2c3a46">FSQ OS Places · Apache 2.0</text>
  <text x="92" y="208" font-size="13.5" fill="#2c3a46">OpenStreetMap · ODbL</text>
  <text x="92" y="228" font-size="13.5" fill="#2c3a46">Wikidata · CC0</text>
  <text x="92" y="245" font-size="12.5" font-style="italic" fill="#2f7a4d">Redistributable · permanent</text>

  <rect x="410" y="134" width="350" height="118" rx="9" fill="#ffffff" stroke="#2f7a4d" stroke-width="2.5"/>
  <text x="430" y="162" font-size="17" font-weight="700" fill="#1d5334">CONFLUENDO</text>
  <text x="430" y="186" font-size="13" fill="#2c3a46">acquire → content-hash → dry-run → stage</text>
  <text x="430" y="205" font-size="13" fill="#2c3a46">→ production package → consumer apply</text>
  <text x="430" y="229" font-size="12.5" fill="#5b6472">Immutable artifacts · delivered ≠ applied</text>
  <text x="430" y="246" font-size="12.5" fill="#5b6472">Never writes Vamo product tables directly</text>

  <line x1="376" y1="193" x2="404" y2="193" stroke="#2f7a4d" stroke-width="8" marker-end="url(#arG)"/>

  <!-- ================= LANE 2 : USER OBSERVATIONS ================= -->
  <rect x="72" y="300" width="300" height="118" rx="9" fill="#e9f0fa" stroke="#2a5d9e" stroke-width="2"/>
  <text x="92" y="328" font-size="17" font-weight="700" fill="#1c406e">User observations</text>
  <text x="356" y="327" font-size="12" font-weight="700" fill="#2a5d9e" text-anchor="end">THOUSANDS</text>
  <text x="92" y="354" font-size="13.5" fill="#2c3a46">Device GPS fixes (opt-in)</text>
  <text x="92" y="374" font-size="13.5" fill="#2c3a46">User-typed / confirmed names</text>
  <text x="92" y="394" font-size="13.5" fill="#2c3a46">Saves, visits, corrections</text>
  <text x="92" y="411" font-size="12.5" font-style="italic" fill="#2a5d9e">Originated by Vamo · ours outright</text>

  <rect x="410" y="300" width="350" height="118" rx="9" fill="#ffffff" stroke="#2a5d9e" stroke-width="2.5"/>
  <text x="430" y="328" font-size="17" font-weight="700" fill="#1c406e">CORROBORATION GATE</text>
  <text x="430" y="352" font-size="13" fill="#2c3a46">k ≥ 3 distinct users, distinct days</text>
  <text x="430" y="371" font-size="13" fill="#2c3a46">Coordinate = median of device fixes</text>
  <text x="430" y="395" font-size="12.5" font-weight="600" fill="#b3261e">Provider payload columns not readable here</text>
  <text x="430" y="412" font-size="12.5" fill="#5b6472">Raw traces dropped on promotion</text>

  <line x1="376" y1="359" x2="404" y2="359" stroke="#2a5d9e" stroke-width="5" marker-end="url(#arB)"/>

  <!-- ================= LANE 3 : PAID API ================= -->
  <rect x="72" y="466" width="300" height="118" rx="9" fill="#fdf1e3" stroke="#a8641b" stroke-width="2"/>
  <text x="92" y="494" font-size="15.5" font-weight="700" fill="#7a4712">Commercial Places API</text>
  <text x="356" y="493" font-size="11" font-weight="700" fill="#a8641b" text-anchor="end">SHRINKING</text>
  <text x="92" y="520" font-size="13.5" fill="#2c3a46">Paid per query · long tail only</text>
  <text x="92" y="540" font-size="13.5" fill="#2c3a46">Photos, live enrichment</text>
  <text x="92" y="560" font-size="13.5" fill="#2c3a46">Bound by API contract</text>
  <text x="92" y="577" font-size="12.5" font-style="italic" fill="#a8641b">Licensed · NOT redistributable</text>

  <rect x="410" y="466" width="350" height="118" rx="9" fill="#ffffff" stroke="#a8641b" stroke-width="2.5"/>
  <text x="430" y="494" font-size="17" font-weight="700" fill="#7a4712">TTL CACHE — TERMINAL</text>
  <text x="430" y="518" font-size="13" fill="#2c3a46">Expires at the contract window</text>
  <text x="430" y="537" font-size="13" fill="#2c3a46">Provider ID retained; payload is not</text>
  <text x="430" y="561" font-size="12.5" font-weight="600" fill="#b3261e">Never promoted to canonical</text>
  <text x="430" y="578" font-size="12.5" fill="#5b6472">Serves the requesting user only</text>

  <line x1="376" y1="525" x2="404" y2="525" stroke="#a8641b" stroke-width="2.5" marker-end="url(#arA)"/>

  <!-- ================= CANONICAL ================= -->
  <rect x="812" y="196" width="248" height="322" rx="11" fill="#f4f6f9" stroke="#2c3a46" stroke-width="2.5"/>
  <text x="836" y="232" font-size="18" font-weight="700" fill="#12171f">Canonical</text>
  <text x="836" y="256" font-size="18" font-weight="700" fill="#12171f">place graph</text>
  <line x1="836" y1="272" x2="1036" y2="272" stroke="#c8cfd8" stroke-width="1.5"/>
  <text x="836" y="298" font-size="13" fill="#2c3a46">location_canonicals</text>
  <text x="836" y="320" font-size="13" fill="#2c3a46">location_source_refs</text>
  <text x="836" y="344" font-size="12.5" font-style="italic" fill="#5b6472">one fact ← one source</text>
  <text x="836" y="362" font-size="12.5" font-style="italic" fill="#5b6472">one source ← one licence</text>
  <line x1="836" y1="380" x2="1036" y2="380" stroke="#c8cfd8" stroke-width="1.5"/>
  <text x="836" y="406" font-size="12.5" font-weight="700" fill="#2f7a4d">Every row in here is</text>
  <text x="836" y="424" font-size="12.5" font-weight="700" fill="#2f7a4d">redistributable or ours.</text>
  <text x="836" y="452" font-size="12.5" fill="#5b6472">Nothing licensed-but-</text>
  <text x="836" y="470" font-size="12.5" fill="#5b6472">restricted ever lands</text>
  <text x="836" y="488" font-size="12.5" fill="#5b6472">in this store.</text>

  <line x1="764" y1="196" x2="806" y2="236" stroke="#2f7a4d" stroke-width="6" marker-end="url(#arG)"/>
  <line x1="764" y1="359" x2="806" y2="359" stroke="#2a5d9e" stroke-width="4.5" marker-end="url(#arB)"/>

  <!-- blocked path from TTL cache -->
  <line x1="764" y1="521" x2="800" y2="486" stroke="#b3261e" stroke-width="2.5" stroke-dasharray="7,6"/>
  <g stroke="#b3261e" stroke-width="3.5">
    <line x1="772" y1="512" x2="790" y2="494"/>
    <line x1="772" y1="494" x2="790" y2="512"/>
  </g>
  <text x="784" y="552" font-size="12.5" font-weight="700" fill="#b3261e">blocked by design</text>

  <!-- ================= PRODUCT ================= -->
  <rect x="1128" y="288" width="272" height="138" rx="9" fill="#f4f6f9" stroke="#2c3a46" stroke-width="2"/>
  <text x="1150" y="322" font-size="17" font-weight="700" fill="#12171f">Vamo app</text>
  <text x="1150" y="348" font-size="13.5" fill="#2c3a46">Search · trip planning</text>
  <text x="1150" y="368" font-size="13.5" fill="#2c3a46">Offline place data</text>
  <text x="1150" y="388" font-size="13.5" fill="#2c3a46">Resale / B2B optionality</text>
  <text x="1150" y="412" font-size="12.5" font-style="italic" fill="#5b6472">unblocked by licence</text>
  <line x1="1064" y1="357" x2="1122" y2="357" stroke="#5b6472" stroke-width="4.5" marker-end="url(#ar)"/>

  <!-- ================= FEEDBACK LOOP (routed outside all boxes) ================= -->
  <path d="M 585 588 L 585 662 L 34 662 L 34 196 L 68 196" fill="none" stroke="#2a5d9e" stroke-width="2.5"
        stroke-dasharray="9,6" marker-end="url(#arB)"/>
  <rect x="624" y="632" width="330" height="46" rx="7" fill="#e9f0fa" stroke="#2a5d9e" stroke-width="1.5"/>
  <text x="642" y="652" font-size="12.5" font-weight="700" fill="#1c406e">Cache miss = demand signal</text>
  <text x="642" y="670" font-size="12" fill="#2c3a46">queue the place for open-data acquisition</text>
  <text x="978" y="660" font-size="12.5" fill="#5b6472">The paid API tells us which places matter.</text>
  <text x="978" y="678" font-size="12.5" fill="#5b6472">Confluendo acquires them from a source we may keep.</text>

  <!-- ================= RULES ================= -->
  <line x1="72" y1="716" x2="1400" y2="716" stroke="#c8cfd8" stroke-width="1.5"/>
  <text x="72" y="744" font-size="14" font-weight="700" fill="#12171f">Load-bearing rules</text>

  <text x="72" y="772" font-size="13" fill="#2c3a46"><tspan font-weight="700" fill="#b3261e">1.</tspan>  The canonical coordinate is computed from device fixes — never copied from a provider response.</text>
  <text x="72" y="796" font-size="13" fill="#2c3a46"><tspan font-weight="700" fill="#b3261e">2.</tspan>  Promotion to canonical requires k ≥ 3 distinct users on distinct days; raw traces are dropped at promotion.</text>
  <text x="72" y="820" font-size="13" fill="#2c3a46"><tspan font-weight="700" fill="#b3261e">3.</tspan>  Consent for the observation layer is a separate, declinable opt-in — not the EULA.</text>
  <text x="72" y="844" font-size="13" fill="#2c3a46"><tspan font-weight="700" fill="#b3261e">4.</tspan>  Provider payloads live only in expiry-bound provider stores — never in the canonical graph or the promotion path.</text>
  <text x="72" y="868" font-size="13" fill="#2c3a46"><tspan font-weight="700" fill="#b3261e">5.</tspan>  Programme metric: <tspan font-weight="700">paid API calls per active user per month</tspan> — must trend down while coverage and freshness hold.</text>
</svg>
