kind: ingestion.pipeline
version: 1
id: vamo-administrative-reference
name: Vamo Administrative Reference
owner: vamo
source:
  id: geonames-municipality-sample
  name: GeoNames Municipality Reference Sample
  adapter: snapshot
  license:
    name: GeoNames CC BY 4.0
    url: https://www.geonames.org/export/
    attribution: GeoNames, CC BY 4.0
    canStoreFacts: true
    canStoreContent: true
    canStoreMediaBytes: false
    liveOnly: false
  connection:
    snapshotPath: fixtures/source.jsonl
    format: jsonl
target:
  id: vamo-place-intelligence
  adapter: supabase_postgres
  project: vamo
  profile: place-intelligence
  dryRunOnly: true
cursor:
  strategy: monotonic_row_id
  field: source_row_id
policyRequests:
  storeFacts: true
  storeContent: true
  storeMediaBytes: false
mappings:
  - from: source.id
    to: location_canonicals.id
    transform: deterministic_uuid
  - from: source.id
    to: location_canonicals.canonical_key
    transform: stable_key
  - from: source.name
    to: location_canonicals.display_name
    transform: trim
  - from: source.name
    to: location_canonicals.name_norm
    transform: lowercase
  - from: scope.category
    to: location_canonicals.feature_type
    transform: vamo_feature_type
  - from: source.country_code
    to: location_canonicals.country_code
  - from: source.parent_code
    to: location_canonicals.administrative_parent_code
    transform: trim
  - from: source.latitude
    to: location_canonicals.latitude
    transform: to_number
  - from: source.longitude
    to: location_canonicals.longitude
    transform: to_number
  - value: geonames
    to: location_canonicals.source_provider
  - from: source.id
    to: location_canonicals.source_place_id
  - from: attribution
    to: location_canonicals.attribution
  - value: seeded
    to: location_canonicals.promotion_state
  - from: source.id
    to: location_source_refs.canonical_id
    transform: deterministic_uuid
  - value: geonames
    to: location_source_refs.provider
  - from: source.id
    to: location_source_refs.source_place_id
  - from: source.dataset_version
    to: location_source_refs.dataset_version
    transform: trim
  - from: source.valid_from
    to: location_source_refs.valid_from
    transform: trim
  - from: source.valid_to
    to: location_source_refs.valid_to
    transform: trim
    optional: true
  - from: attribution
    to: location_source_refs.attribution
qualityGates:
  - id: require-source-attribution
    type: attribution_present
    severity: block
  - id: require-municipality-category
    type: allowed_values
    severity: block
    field: scope.category
    values:
      - municipality
