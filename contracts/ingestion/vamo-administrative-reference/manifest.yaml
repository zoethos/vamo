kind: ingestion.consumer_contract
consumer: vamo
profile: administrative-reference
version: 1
title: Vamo Administrative Reference Ingestion Contract
description: >-
  Vamo's governed municipality baseline. The platform imports a pinned snapshot
  of this contract and never reads the Vamo repository at runtime.
exports:
  pipeline: pipeline.yaml
  target: target.yaml
  fixtures:
    - fixtures/source.jsonl
display:
  queue:
    fields:
      - key: place_type
        label: Place type
        source: scope.category
        presenter: vamo_poi_type
        detail:
          source: scope.category
          presenter: vamo_feature_type_mapping
